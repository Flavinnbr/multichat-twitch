<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multichat Twitch PRO</title>
<style>
:root{
  --text:#f7f7fb;
  --muted:#aab1c2;
  --panel:rgba(11,14,22,.70);
  --panel-strong:rgba(12,15,24,.88);
  --border:rgba(255,255,255,.08);
  --shadow:0 8px 24px rgba(0,0,0,.22);
  --radius:14px;
  --font-size:18px;
  --channel-size:10px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}
#shell{width:100%;height:100%;padding:8px;display:flex;flex-direction:column;gap:8px}
#header{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 11px;border-radius:var(--radius);
  background:var(--panel-strong);border:1px solid var(--border);
  box-shadow:var(--shadow);backdrop-filter:blur(10px)
}
#title{font-size:14px;font-weight:900;letter-spacing:.06em}
#status{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#messages{
  min-height:0;flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  gap:5px;overflow:hidden
}
.message{
  padding:8px 10px;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--border);
  box-shadow:var(--shadow);backdrop-filter:blur(8px);
  animation:msgIn .22s cubic-bezier(.2,.8,.2,1);
  transition:opacity .65s ease,transform .65s ease;
  overflow:hidden
}
.message.leaving{opacity:0;transform:translateY(-4px) scale(.985)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}

.meta{
  display:flex;align-items:center;gap:5px;min-width:0;margin-bottom:2px
}
.channel{
  font-size:var(--channel-size);font-weight:900;letter-spacing:.06em;
  padding:3px 6px;border-radius:999px;color:#fff;flex:none
}
.ch-flavinnbr{background:#2563eb}.ch-sangras{background:#9333ea}.ch-bonecao{background:#16a34a}
.badges{display:inline-flex;gap:3px;align-items:center;flex:none}
.badge-img{height:16px;width:auto;vertical-align:middle}
.username{
  font-weight:850;font-size:calc(var(--font-size) - 1px);
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.message-text{
  font-size:var(--font-size);line-height:1.33;overflow-wrap:anywhere;
  text-shadow:0 1px 2px rgba(0,0,0,.28)
}
.emote{height:1.45em;vertical-align:middle;margin:-3px 1px}
.emote.big{height:2.35em}
.reply{font-size:11px;color:var(--muted);margin-bottom:3px}
.action .message-text{font-style:italic}
.highlight{border-color:rgba(255,255,255,.18)}

body.hide-header #header{display:none}
body.compact .message{padding:6px 8px}
body.compact .meta{margin-bottom:1px}
body.no-bg .message{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}
body.no-bg #header{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}

#setup{
 position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
 padding:24px;background:#090b11;color:#fff;overflow:auto
}
#setup.hidden{display:none}
.card{
 width:min(760px,100%);padding:24px;border-radius:20px;background:#121620;
 border:1px solid rgba(255,255,255,.10);box-shadow:0 22px 60px rgba(0,0,0,.42)
}
.card h1{margin:0 0 8px;font-size:25px}.card p{color:#bac1d1;line-height:1.5}
.card label{display:block;margin:14px 0 6px;font-size:12px;font-weight:800}
.card input{
 width:100%;padding:12px 13px;border:1px solid rgba(255,255,255,.13);
 border-radius:11px;background:#0c1018;color:#fff;outline:none
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:850;cursor:pointer}
.primary{background:#9147ff;color:#fff}.secondary{background:#252a36;color:#fff}
.small{font-size:12px;color:#8f98ad;margin-top:10px;line-height:1.45}
.ok{color:#64d98b}.warn{color:#ffce6a}
code{background:#0b0e15;padding:2px 5px;border-radius:5px}
</style>
</head>
<body>
<div id="setup">
  <div class="card">
    <h1>Multichat Twitch PRO</h1>
    <p>Feed unificado de <strong>Flavinnbr</strong>, <strong>Sangras</strong> e <strong>Bonecao</strong>, com badges reais e suporte a emotes Twitch, 7TV, BTTV e FFZ.</p>
    <div id="callbackInfo"></div>

    <label for="clientId">Client ID do aplicativo Twitch</label>
    <input id="clientId" autocomplete="off" placeholder="Cole seu Client ID">

    <div class="grid">
      <div>
        <label for="maxMessages">Máximo de mensagens</label>
        <input id="maxMessages" type="number" min="5" max="100" value="25">
      </div>
      <div>
        <label for="fadeSeconds">Fade após (segundos)</label>
        <input id="fadeSeconds" type="number" min="0" max="600" value="30">
      </div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="secondary">Salvar</button>
      <button id="loginBtn" class="primary">Entrar com Twitch</button>
    </div>

    <div class="small">
      Parâmetros úteis na URL:
      <code>?header=0</code>,
      <code>&compact=1</code>,
      <code>&bg=0</code>,
      <code>&fade=30</code>,
      <code>&max=25</code>.
    </div>
  </div>
</div>

<div id="shell">
  <div id="header">
    <div id="title">CHAT UNIFICADO</div>
    <div id="status">Aguardando login</div>
  </div>
  <div id="messages"></div>
</div>

<script>
(() => {
  const CHANNELS = ["flavinnbr","sangras","bonecao"];
  const LABELS = {flavinnbr:"FLAVINNBR",sangras:"SANGRAS",bonecao:"BONECAO"};

  const setup = document.getElementById("setup");
  const clientIdInput = document.getElementById("clientId");
  const maxInput = document.getElementById("maxMessages");
  const fadeInput = document.getElementById("fadeSeconds");
  const statusEl = document.getElementById("status");
  const messagesEl = document.getElementById("messages");
  const callbackInfo = document.getElementById("callbackInfo");

  let ws=null,reconnectTimer=null;
  let maxMessages=25,fadeSeconds=30;

  const userIds = {};
  const twitchBadges = {global:{},channels:{}};
  const thirdParty = {global:new Map(),channels:{}};

  const qs=new URLSearchParams(location.search);
  if(qs.get("header")==="0") document.body.classList.add("hide-header");
  if(qs.get("compact")==="1") document.body.classList.add("compact");
  if(qs.get("bg")==="0") document.body.classList.add("no-bg");

  const redirectUri=location.origin+location.pathname;
  callbackInfo.innerHTML=`
    <p><strong>URL OAuth cadastrada na Twitch:</strong><br><code>${esc(redirectUri)}</code></p>
    <p class="${location.protocol==="https:"?"ok":"warn"}">
      ${location.protocol==="https:"?"✓ HTTPS detectado.":"⚠ Hospede via HTTPS para autenticar."}
    </p>`;

  clientIdInput.value=localStorage.getItem("mc_client_id")||"";
  maxInput.value=localStorage.getItem("mc_max")||"25";
  fadeInput.value=localStorage.getItem("mc_fade")||"30";

  document.getElementById("saveBtn").onclick=saveConfig;
  document.getElementById("loginBtn").onclick=startLogin;

  function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
  function saveConfig(){
    const id=clientIdInput.value.trim();
    if(!id){alert("Cole o Client ID.");return false}
    maxMessages=Math.max(5,Math.min(100,Number(maxInput.value||25)));
    fadeSeconds=Math.max(0,Math.min(600,Number(fadeInput.value||30)));
    localStorage.setItem("mc_client_id",id);
    localStorage.setItem("mc_max",String(maxMessages));
    localStorage.setItem("mc_fade",String(fadeSeconds));
    return true
  }
  function randomState(){
    const a=new Uint8Array(24);crypto.getRandomValues(a);
    return Array.from(a,b=>b.toString(16).padStart(2,"0")).join("")
  }
  function startLogin(){
    if(!saveConfig())return;
    if(location.protocol!=="https:"){alert("Abra a versão HTTPS publicada no GitHub Pages.");return}
    const state=randomState();sessionStorage.setItem("mc_oauth_state",state);
    const p=new URLSearchParams({
      response_type:"token",
      client_id:localStorage.getItem("mc_client_id"),
      redirect_uri:redirectUri,
      scope:"chat:read",
      state
    });
    location.href="https://id.twitch.tv/oauth2/authorize?"+p.toString()
  }
  async function consumeOAuthCallback(){
    if(!location.hash.includes("access_token="))return false;
    const hp=new URLSearchParams(location.hash.slice(1));
    const token=hp.get("access_token"),state=hp.get("state"),expected=sessionStorage.getItem("mc_oauth_state");
    history.replaceState({},document.title,location.pathname+location.search);
    if(!token||!state||!expected||state!==expected){sessionStorage.removeItem("mc_oauth_state");alert("Falha na validação OAuth.");return false}
    sessionStorage.removeItem("mc_oauth_state");
    return await storeValidatedToken(token)
  }
  async function storeValidatedToken(token){
    try{
      const r=await fetch("https://id.twitch.tv/oauth2/validate",{headers:{Authorization:"OAuth "+token}});
      if(!r.ok)throw 0;
      const d=await r.json();
      localStorage.setItem("mc_token",token);
      localStorage.setItem("mc_login",String(d.login||"").toLowerCase());
      if(d.client_id)localStorage.setItem("mc_client_id",d.client_id);
      return true
    }catch{
      localStorage.removeItem("mc_token");localStorage.removeItem("mc_login");return false
    }
  }
  async function validateStoredToken(){
    const t=localStorage.getItem("mc_token");if(!t)return false;
    return await storeValidatedToken(t)
  }

  async function helix(path){
    const token=localStorage.getItem("mc_token");
    const clientId=localStorage.getItem("mc_client_id");
    const r=await fetch("https://api.twitch.tv/helix/"+path,{
      headers:{"Client-Id":clientId,Authorization:"Bearer "+token}
    });
    if(!r.ok)throw new Error("Helix "+r.status);
    return await r.json()
  }

  async function loadUserIds(){
    try{
      const q=CHANNELS.map(c=>"login="+encodeURIComponent(c)).join("&");
      const d=await helix("users?"+q);
      for(const u of d.data||[])userIds[u.login.toLowerCase()]=u.id
    }catch(e){console.warn("IDs Twitch:",e)}
  }

  function badgeMapFromResponse(d){
    const out={};
    for(const set of d.data||[]){
      out[set.set_id]={};
      for(const v of set.versions||[])out[set.set_id][v.id]=v.image_url_2x||v.image_url_1x
    }
    return out
  }
  async function loadTwitchBadges(){
    try{twitchBadges.global=badgeMapFromResponse(await helix("chat/badges/global"))}catch(e){console.warn(e)}
    for(const ch of CHANNELS){
      const id=userIds[ch]; if(!id)continue;
      try{twitchBadges.channels[ch]=badgeMapFromResponse(await helix("chat/badges?broadcaster_id="+encodeURIComponent(id)))}catch(e){console.warn(e)}
    }
  }

  function addEmote(map,name,url){if(name&&url&&!map.has(name))map.set(name,url)}
  async function load7TV(ch,id){
    try{
      const r=await fetch("https://7tv.io/v3/users/twitch/"+id);
      if(!r.ok)return;
      const d=await r.json();
      for(const e of d.emote_set?.emotes||[]){
        addEmote(thirdParty.channels[ch],e.name,`https://cdn.7tv.app/emote/${e.id}/2x.webp`)
      }
    }catch(e){console.warn("7TV",ch,e)}
  }
  async function load7TVGlobal(){
    try{
      const r=await fetch("https://7tv.io/v3/emote-sets/global");if(!r.ok)return;
      const d=await r.json();
      for(const e of d.emotes||[])addEmote(thirdParty.global,e.name,`https://cdn.7tv.app/emote/${e.id}/2x.webp`)
    }catch(e){console.warn("7TV global",e)}
  }
  async function loadBTTV(ch,id){
    try{
      const r=await fetch("https://api.betterttv.net/3/cached/users/twitch/"+id);if(!r.ok)return;
      const d=await r.json();
      for(const e of [...(d.channelEmotes||[]),...(d.sharedEmotes||[])])
        addEmote(thirdParty.channels[ch],e.code,`https://cdn.betterttv.net/emote/${e.id}/2x`)
    }catch(e){console.warn("BTTV",ch,e)}
  }
  async function loadBTTVGlobal(){
    try{
      const r=await fetch("https://api.betterttv.net/3/cached/emotes/global");if(!r.ok)return;
      for(const e of await r.json())addEmote(thirdParty.global,e.code,`https://cdn.betterttv.net/emote/${e.id}/2x`)
    }catch(e){console.warn("BTTV global",e)}
  }
  async function loadFFZ(ch,id){
    try{
      const r=await fetch("https://api.frankerfacez.com/v1/room/id/"+id);if(!r.ok)return;
      const d=await r.json();
      for(const set of Object.values(d.sets||{}))for(const e of set.emoticons||[]){
        const u=e.urls?.["2"]||e.urls?.["1"]; if(u)addEmote(thirdParty.channels[ch],e.name,(u.startsWith("//")?"https:":"")+u)
      }
    }catch(e){console.warn("FFZ",ch,e)}
  }
  async function loadFFZGlobal(){
    try{
      const r=await fetch("https://api.frankerfacez.com/v1/set/global");if(!r.ok)return;
      const d=await r.json();
      for(const set of Object.values(d.sets||{}))for(const e of set.emoticons||[]){
        const u=e.urls?.["2"]||e.urls?.["1"]; if(u)addEmote(thirdParty.global,e.name,(u.startsWith("//")?"https:":"")+u)
      }
    }catch(e){console.warn("FFZ global",e)}
  }

  async function loadExtras(){
    CHANNELS.forEach(ch=>thirdParty.channels[ch]=new Map());
    await loadUserIds();
    await Promise.all([loadTwitchBadges(),load7TVGlobal(),loadBTTVGlobal(),loadFFZGlobal()]);
    await Promise.all(CHANNELS.flatMap(ch=>{
      const id=userIds[ch]; return id?[load7TV(ch,id),loadBTTV(ch,id),loadFFZ(ch,id)]:[]
    }));
  }

  function connectIRC(){
    clearTimeout(reconnectTimer);
    const token=localStorage.getItem("mc_token"),nick=localStorage.getItem("mc_login");
    maxMessages=Number(qs.get("max")||localStorage.getItem("mc_max")||25);
    fadeSeconds=Number(qs.get("fade")??localStorage.getItem("mc_fade")??30);
    if(!token||!nick){setup.classList.remove("hidden");return}

    if(ws&&(ws.readyState===0||ws.readyState===1))ws.close();
    statusEl.textContent="Conectando...";
    ws=new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ws.onopen=()=>{
      ws.send("PASS oauth:"+token);
      ws.send("NICK "+nick);
      ws.send("CAP REQ :twitch.tv/membership twitch.tv/tags twitch.tv/commands");
      ws.send("JOIN "+CHANNELS.map(c=>"#"+c).join(","));
    };
    ws.onmessage=e=>String(e.data).split("\r\n").filter(Boolean).forEach(handleLine);
    ws.onerror=()=>statusEl.textContent="Erro de conexão";
    ws.onclose=()=>{statusEl.textContent="Reconectando...";reconnectTimer=setTimeout(connectIRC,5000)}
  }

  function parseTags(s){
    const o={};
    for(const pair of s.split(";")){
      const i=pair.indexOf("=");if(i<0)continue;
      o[pair.slice(0,i)]=pair.slice(i+1)
        .replaceAll("\\s"," ").replaceAll("\\:",";").replaceAll("\\\\","\\")
    }
    return o
  }

  function handleLine(line){
    if(line.startsWith("PING")){ws?.send(line.replace("PING","PONG"));return}
    if(line.includes(" 001 ")){statusEl.textContent="Conectado • 3 canais";return}
    if(/authentication failed/i.test(line)){
      localStorage.removeItem("mc_token");localStorage.removeItem("mc_login");
      setup.classList.remove("hidden");statusEl.textContent="Login expirado";return
    }
    if(!line.includes(" PRIVMSG "))return;
    const firstSpace=line.indexOf(" ");
    const tags=parseTags(line.startsWith("@")?line.slice(1,firstSpace):"");
    const idx=line.indexOf(" PRIVMSG ");
    const after=line.slice(idx+9),sp=after.indexOf(" ");
    const channel=after.slice(0,sp).replace("#","").toLowerCase();
    const mi=after.indexOf(" :");
    let message=mi>=0?after.slice(mi+2):"";
    addMessage(channel,tags,message)
  }

  function renderBadges(ch,raw){
    if(!raw)return "";
    const local=twitchBadges.channels[ch]||{}, global=twitchBadges.global||{};
    return raw.split(",").map(part=>{
      const [set,ver]=part.split("/");
      const url=local?.[set]?.[ver]||global?.[set]?.[ver];
      return url?`<img class="badge-img" src="${esc(url)}" alt="${esc(set)}">`:""
    }).join("")
  }

  function twitchEmoteRanges(text,tag){
    const ranges=[];
    if(!tag)return ranges;
    for(const group of tag.split("/")){
      const [id,pos]=group.split(":"); if(!id||!pos)continue;
      for(const r of pos.split(",")){
        const [start,end]=r.split("-").map(Number);
        if(Number.isFinite(start)&&Number.isFinite(end))
          ranges.push({start,end,html:`<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(id)}/default/dark/2.0" alt="${esc(text.slice(start,end+1))}">`})
      }
    }
    return ranges
  }

  function renderMessageText(ch,text,twitchTag){
    const ranges=twitchEmoteRanges(text,twitchTag).sort((a,b)=>a.start-b.start);
    if(ranges.length){
      let out="",cur=0;
      for(const r of ranges){
        if(r.start<cur)continue;
        out+=renderThirdParty(ch,text.slice(cur,r.start));
        out+=r.html;cur=r.end+1
      }
      out+=renderThirdParty(ch,text.slice(cur));
      return out
    }
    return renderThirdParty(ch,text)
  }

  function renderThirdParty(ch,text){
    const map=new Map([...thirdParty.global,...(thirdParty.channels[ch]||new Map())]);
    if(!map.size)return esc(text);
    const parts=text.split(/(\s+)/);
    return parts.map(p=>{
      const url=map.get(p);
      return url?`<img class="emote" src="${esc(url)}" alt="${esc(p)}">`:esc(p)
    }).join("")
  }

  function addMessage(ch,tags,message){
    if(!CHANNELS.includes(ch))return;
    const name=tags["display-name"]||tags["login"]||"Usuário";
    const color=tags["color"]||"#ffffff";
    const el=document.createElement("div");
    el.className="message";
    const badges=renderBadges(ch,tags["badges"]);
    const reply=tags["reply-parent-display-name"]?`<div class="reply">↪ resposta a ${esc(tags["reply-parent-display-name"])}</div>`:"";
    el.innerHTML=`
      ${reply}
      <div class="meta">
        <span class="channel ch-${ch}">${LABELS[ch]||esc(ch)}</span>
        <span class="badges">${badges}</span>
        <span class="username" style="color:${esc(color)}">${esc(name)}</span>
      </div>
      <div class="message-text">${renderMessageText(ch,message,tags["emotes"])}</div>`;
    messagesEl.appendChild(el);

    while(messagesEl.children.length>maxMessages)messagesEl.firstElementChild.remove();

    if(fadeSeconds>0){
      setTimeout(()=>{
        if(!el.isConnected)return;
        el.classList.add("leaving");
        setTimeout(()=>el.remove(),700)
      },fadeSeconds*1000)
    }
  }

  async function boot(){
    const got=await consumeOAuthCallback();
    const valid=got?true:await validateStoredToken();
    if(valid){
      setup.classList.add("hidden");
      statusEl.textContent="Carregando emotes e badges...";
      await loadExtras();
      connectIRC()
    }else{
      setup.classList.remove("hidden");
      statusEl.textContent="Entre com a Twitch"
    }
  }
  boot()
})();
</script>
</body>
</html>
